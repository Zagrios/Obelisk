name: SailOver
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ARCHS: $(NATIVE_ARCH_ACTUAL)
    ONLY_ACTIVE_ARCH: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  SailOver:
    type: application
    platform: macOS
    sources:
      - path: SailOver
        excludes:
          - "Bridge/Generated/*.h"
          - "Bridge/Generated/*.modulemap"
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDevelopmentRegion: en
        SWIFT_EMIT_LOC_STRINGS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        ENABLE_APP_SANDBOX: NO
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/SailOver/Bridge/Generated"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/SailOver/Bridge/Generated"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../../build/rust/$(CONFIGURATION)"
        OTHER_LDFLAGS: "$(inherited) -lsailover_bridge -framework Security -framework SystemConfiguration -liconv"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    preBuildScripts:
      - name: Build Rust and generate Swift bindings
        script: '"$SRCROOT/../../scripts/build-rust.sh"'
        basedOnDependencyAnalysis: false
      - name: Build and sign native Steam helper
        script: '"$SRCROOT/../../scripts/build-steam-native.sh"'
        basedOnDependencyAnalysis: false
  SailOverTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SailOverTests
    dependencies:
      - target: SailOver
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.zagrios.sailover.tests
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/SailOver/Bridge/Generated"
schemes:
  SailOver:
    build:
      targets:
        SailOver: all
    test:
      targets:
        - SailOverTests

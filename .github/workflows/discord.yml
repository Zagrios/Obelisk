# Posts each published release in the Discord server's #releases channel, with
# its notes. Run it from the Actions tab with a tag to post a release again.
# DISCORD_RELEASES_WEBHOOK is the channel's webhook.
name: Discord

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to post, such as v0.3.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  announce:
    # Pre-releases, the betas built every two hours, are never posted.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (startsWith(github.event.release.tag_name, 'v') && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      NAME: ${{ github.event.repository.name }}
      WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Post the release
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json name,tagName,url,body,publishedAt > release.json
          # Embeds show no Markdown headings, so they become bold lines; an
          # embed's text holds 4096 characters.
          jq --arg name "$NAME" '{
            username: $name,
            avatar_url: "https://raw.githubusercontent.com/Zagrios/obelisk/main/assets/readme/icon.png",
            embeds: [{
              title: (if .name == "" then .tagName else .name end),
              url: .url,
              description: (.body | gsub("\r"; "") | split("\n")
                | map(if test("^#+ ") then "**" + sub("^#+ +"; "") + "**" else . end) | join("\n")
                | if length > 4000 then .[0:4000] + "…" else . end),
              color: 9133302,
              timestamp: .publishedAt
            }]
          }' release.json > message.json
          curl -fsS -H 'Content-Type: application/json' --data @message.json "$WEBHOOK"

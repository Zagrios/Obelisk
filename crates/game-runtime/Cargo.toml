[package]
name = "game-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
sha2 = "0.10"
# The Ed25519 check of Voile's feed, from the aws-lc-rs that rustls already builds.
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys"] }
base64.workspace = true
zeroize = { version = "1", features = ["derive"] }
tempfile.workspace = true
zip = { version = "=8.2.0", default-features = false, features = ["deflate-flate2"] }
# zip pulls flate2 without a backend; this selects rust_backend for the
# standalone steam-native workspace, where no other crate unifies it in.
flate2.workspace = true
reqwest.workspace = true
# Steam's DevTools, which hand Windows Steam the login token Obelisk signed in.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect"] }
futures-util.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "signal"] }
steam-kit.workspace = true
cloud-vault.workspace = true
epic-kit.workspace = true
gog-kit.workspace = true
obelisk-core.workspace = true

[dev-dependencies]
sha1.workspace = true
cloud-vault = { workspace = true, features = ["testing"] }
epic-kit = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

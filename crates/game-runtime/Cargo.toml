[package]
name = "game-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
tempfile.workspace = true
zip = { version = "=8.2.0", default-features = false, features = ["deflate-flate2"] }
# zip pulls flate2 without a backend; this selects rust_backend for the
# standalone steam-native workspace, where no other crate unifies it in.
flate2.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
steam-kit.workspace = true
cloud-vault.workspace = true
epic-kit.workspace = true
forge-core.workspace = true

[dev-dependencies]
sha1.workspace = true
cloud-vault = { workspace = true, features = ["testing"] }

[features]
packaging = []

[[bin]]
name = "forge-steam-runtime-package"
path = "src/bin/package.rs"
required-features = ["packaging"]

[lints]
workspace = true
